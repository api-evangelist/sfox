name: Sfox
description: >-
  sFOX is a unified crypto prime brokerage and infrastructure platform for
  professional and institutional investors — asset managers, hedge funds, family
  offices, and financial institutions. It aggregates liquidity from 30+ providers
  across 80+ markets for smart-routed best execution, and combines that with
  bankruptcy-remote custody (sFOX SAFE, via SAFE Trust Company), staking, credit,
  and post-trade settlement in one platform. sFOX exposes a REST API, a WebSocket
  streaming API, and a FIX API for trading, account management, RFQ, transfers,
  custody, staking, market data, and reporting; a separate white-label "Connect"
  API covers end-user onboarding, KYC/KYB, bank linking (Plaid/Dwolla), payments,
  withdrawals, and SSO for businesses building crypto products.
