apis:
- name: sFOX REST API
  description: >-
    REST API for trading, order management, RFQ, account balances and
    transactions, transfers/deposits/withdrawals, custody (sFOX SAFE), staking,
    post-trade settlement, market data, and reporting. Bearer-token API-key auth
    over HTTPS.
  humanURL: https://docs.sfox.com/introduction/getting-started
  baseURL: https://api.sfox.com
  properties:
  - type: Documentation
    url: https://docs.sfox.com/
  - type: APIReference
    url: https://docs.sfox.com/rest-api/rest-endpoints
  - type: Authentication
    url: authentication/sfox-authentication.yml
  - type: LLMsTxt
    url: llms/sfox-llms.txt
  - type: OpenAPI
    url: https://docs.sfox.com/rest-api/rest-endpoints
- name: sFOX WebSocket API
  description: >-
    Real-time streaming API for market data (order book, trades, ticker) and
    private account data (open orders, trades, balances, post-trade settlement).
    Authenticate then subscribe to feeds.
  humanURL: https://docs.sfox.com/websocket-api/introduction
  baseURL: https://ws.sfox.com
  properties:
  - type: Documentation
    url: https://docs.sfox.com/websocket-api/introduction
  - type: AsyncAPI
    url: asyncapi/sfox-websocket-asyncapi.yml
- name: sFOX Connect API
  description: >-
    White-label REST + WebSocket API for businesses: end-user management,
    KYC/KYB and Enhanced Due Diligence, bank-account linking (Plaid), ACH
    (Dwolla) and wire payments, withdrawals, transfers, monetization settings,
    and SSO (SAML).
  humanURL: https://docs.sfox.com/connect/introduction/welcome
  baseURL: https://api.sfox.com
  properties:
  - type: Documentation
    url: https://docs.sfox.com/connect/introduction/welcome
